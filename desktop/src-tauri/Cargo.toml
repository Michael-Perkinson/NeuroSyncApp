[package]
name = "neurosyncapp-host"
version = "0.1.0"
description = "Gate 0 Tauri host for NeuroSyncApp"
authors = ["Michael Perkinson"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "neurosyncapp_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
rfd = "=0.15.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tauri = { version = "=2.11.2", features = [] }
